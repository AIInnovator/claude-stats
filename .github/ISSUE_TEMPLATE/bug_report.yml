name: Bug report
description: Something shows the wrong number, fails to load or breaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out emails, organization names, prompts and project paths: Presenting mode (the eye, or `p`) hides most of them before you take a screenshot.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `node server.mjs`
        2. Open http://127.0.0.1:7420, pick 7 days
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: claude-stats version
      description: From package.json or the release you installed.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, WSL]
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`, if it matters.
  - type: textarea
    id: logs
    attributes:
      label: Server output or browser console errors
      render: text
